[package]
name = "app"
version = "0.1.0"
description = "自然拾光记账客户端 —— 本地桌面记账报税助手"
authors = ["zrsj"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
imap = "2.4"
native-tls = "0.2"
mailparse = "0.14"
pdf-extract = "0.7"
ureq = "2"
aes-gcm = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
tauri-plugin-single-instance = "2.5.4"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
getrandom = "0.2"
zip = { version = "2", features = ["deflate"] }

[features]
# this feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
